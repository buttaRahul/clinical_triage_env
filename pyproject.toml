[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-triage-navigator"
version = "1.0.0"
description = "OpenEnv ER triage simulation — ESI-based agent training environment"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "openai>=1.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clinical_triage_env*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
