---
# OpenEnv Environment Manifest

name: clinical-triage-navigator
version: "1.1.0"
description: >
  Emergency department triage simulation for AI agent training and evaluation.
  Agents assign Emergency Severity Index (ESI) levels to synthetic patients,
  request appropriate resources, decide patient disposition, and escalate
  sentinel conditions (STEMI, sepsis, stroke, PE, etc.).
  Three tasks with deterministic graders, asymmetric reward design
  (under-triage penalised 5× over-triage), and seed-locked realism transforms.

author: "Clinical Triage Navigator Contributors"
license: "Apache-2.0"

tags:
  - healthcare
  - triage
  - ESI
  - emergency-medicine
  - real-world
  - multi-step
  - reward-shaping
  - sentinel-conditions

# ── API ────────────────────────────────────────────
action_type: TriageAction
observation_type: TriageObservation
state_type: TriageState

action_space:
  description: >
    Agent submits a triage decision for the current patient.
  fields:
    esi_level:
      type: integer
      range: [1, 5]
      description: "Emergency Severity Index level (1=most critical, 5=least)"
    resources_requested:
      type: array[string]
      enum: [IV_ACCESS, LABS, ECG, IMAGING_XRAY, IMAGING_CT, IMAGING_MRI,
             MEDICATION_IV, MEDICATION_ORAL, SPECIALIST_CONSULT,
             BEDSIDE_MONITORING, PROCEDURE, NONE]
      description: "Resources the patient needs (determines ESI 3/4/5 discrimination)"
    disposition:
      type: string
      enum: [resus_bay, trauma_bay, monitored_bed, fast_track, waiting_room]
      description: "Recommended patient placement"
    escalation:
      type: string
      enum: [NONE, ACTIVATE_TEAM, ALERT_SENIOR]
      description: >
        Escalation flag for sentinel conditions.
        ACTIVATE_TEAM: immediate team activation (STEMI, stroke, sepsis, cardiac arrest).
        ALERT_SENIOR: alert senior clinician — high suspicion not yet confirmed (PE, SAH).
        NONE: standard triage, no sentinel condition suspected.
    clinical_reasoning:
      type: string
      description: "Free-text rationale. Scored on hard task."

observation_space:
  description: >
    After each step, the agent receives clinical feedback on its last decision
    and the next patient card (or done=true).
  fields:
    current_patient:
      type: PatientCard | null
      description: "Patient to triage. Null when episode is complete."
    last_action_feedback:
      type: string
      description: "Clinical feedback: ESI accuracy, resources, disposition, sentinel result"
    last_esi_correct:
      type: boolean | null
    last_esi_assigned:
      type: integer | null
    last_esi_ground_truth:
      type: integer | null
    patients_remaining:
      type: integer
    patients_triaged:
      type: integer
    step_reward:
      type: float
    cumulative_reward:
      type: float
    done:
      type: boolean
    task_name:
      type: string
    task_description:
      type: string

# ── Tasks ──────────────────────────────────────────
tasks:
  - name: easy
    description: >
      10 patients with clear, unambiguous presentations covering all ESI levels (1–5).
      Vital signs are seed-perturbed on each reset. No atypical presentations.
      3 sentinel conditions embedded (STEMI, SAH, STROKE).
    difficulty: easy
    n_cases: 10
    sentinel_cases: 3
    grader: "0.7 × esi_accuracy + 0.3 × sentinel_accuracy"
    pass_threshold: 0.60

  - name: medium
    description: >
      10 patients with competing priorities and higher acuity mix.
      Includes atypical presentations and 3 sentinel conditions
      (NSTEMI, ectopic pregnancy, PE). PMH randomly omitted 40% per item.
      Requires correct escalation on time-critical cases.
    difficulty: medium
    n_cases: 10
    sentinel_cases: 3
    grader: "0.6 × esi_accuracy + 0.4 × sentinel_accuracy"
    pass_threshold: 0.55

  - name: hard
    description: >
      10-patient mass casualty scenario with incomplete histories, ethical complexity,
      and 3 sentinel conditions (cardiac arrest, overdose, sepsis).
      Clinical reasoning scored. Under-triage of ESI-1/2 heavily penalised.
      Episode-end bonus for zero critical misses.
    difficulty: hard
    n_cases: 10
    sentinel_cases: 3
    grader: "0.55 × esi_accuracy + 0.45 × sentinel_accuracy + episode_bonus"
    pass_threshold: 0.45

# ── Reward ─────────────────────────────────────────
reward:
  range: [-5.0, 2.10]
  normalized_range: [0.0, 1.0]
  note: "Asymmetric design — under-triage penalised 5× harder than over-triage"
  components:
    - name: esi_exact_match
      value: +1.00
    - name: esi_over_triage_1
      value: +0.50
      note: "Slight over-triage is safe and rewarded"
    - name: esi_over_triage_2
      value: -0.20
    - name: esi_over_triage_3plus
      value: -0.50
    - name: esi_under_triage_1
      value: -1.00
      note: "Under-triage is clinically dangerous"
    - name: esi_under_triage_2
      value: -2.50
    - name: esi_under_triage_3plus
      value: -5.00
      note: "Critical miss — ESI-1 patient sent to waiting room"
    - name: sentinel_correct_escalation
      value: +0.40
      note: "ACTIVATE_TEAM or ALERT_SENIOR on a sentinel patient"
    - name: sentinel_missed
      value: -3.00
      note: "No escalation on STEMI/sepsis/stroke/PE/etc."
    - name: false_escalation_activate
      value: -0.20
    - name: false_escalation_alert
      value: -0.10
    - name: resource_correct
      value: +0.10 per resource
    - name: resource_false_positive
      value: -0.05 per resource
    - name: disposition_correct
      value: +0.20
    - name: idle_penalty
      value: -0.01 per step
    - name: episode_bonus_zero_critical_misses
      value: +0.50
      note: "No ESI-1 or ESI-2 patient under-triaged during full episode"

# ── Deployment ─────────────────────────────────────
deployment:
  sdk: docker
  port: 8000
  app_port: 8000
  base_path: /web
  env_vars:
    TRIAGE_TASK:
      default: easy
      options: [easy, medium, hard]
      description: "Which task difficulty to run"
    ENABLE_WEB_INTERFACE:
      default: "true"
      description: "Enable the built-in HTML web interface"

# ── Evaluation ─────────────────────────────────────
evaluation:
  baseline_model: Qwen/Qwen2.5-72B-Instruct
  baseline_scores:
    easy: 0.58
    medium: 0.70
    hard: 0.72
  score_endpoint: /score
  score_range: [0.0, 1.0]
